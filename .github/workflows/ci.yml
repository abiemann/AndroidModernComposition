name: Verify Field Notes

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: android-actions/setup-android@v4
      - name: Install compile SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate documentation and test reporting
        run: |
          python scripts/verify-doc-links.py
          python -m unittest discover -s scripts/tests -v
      - name: Run JVM method tests, lint, and assemble development apps
        id: host-tests
        run: |
          chmod +x gradlew
          ./gradlew --stacktrace :domain:test :data:testDebugUnitTest :feature:testDebugUnitTest :legacy:testDebugUnitTest :app:testDemoDebugUnitTest :app:lintDemoDebug :app:assembleDemoDebug :app:assembleLocalDebug
      - name: Summarize host tests
        if: always() && steps.host-tests.outcome != 'skipped'
        run: python scripts/summarize-tests.py --require-results
      - name: Preserve reports and demo APK
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: host-verification
          path: |
            **/build/reports/
            **/build/test-results/
            app/build/outputs/apk/demo/debug/*.apk
          retention-days: 14
